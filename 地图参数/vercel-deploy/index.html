<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PEAK 地图参数手册</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">
<h1>🏔️ PEAK 地图参数手册</h1>
<p>全关卡 · 全变体 · 全生成器 · 全参数 — 中英双语 · 可搜索 · 可折叠</p>
<div class="stats">
<span class="stat"><strong>7</strong> 关卡</span>
<span class="stat"><strong>32</strong> 变体</span>
<span class="stat"><strong>1261</strong> 生成步骤</span>
<span class="stat">更新 <strong>2026-05-31 12:13</strong></span>
</div>
</div>

<div class="search-bar">
<span class="search-input-group">
<input type="text" id="searchInput" placeholder="🔍  搜索中文或英文 — 物件名、参数名、变体名、数值…" oninput="doSearch()" onkeydown="if(event.key==='Escape')clearSearch()">
<button class="search-clear" onclick="clearSearch()" title="清除搜索 (Esc)">✕</button>
</span>
<span class="search-info" id="searchInfo"></span>
</div>

<div class="tabs" id="tabBar"><button class="tab-btn" onclick="showTab('Beach_Segment')">1. 海滩 (Beach)</button><button class="tab-btn" onclick="showTab('Jungle_Segment')">2. 雨林 (Jungle)</button><button class="tab-btn" onclick="showTab('Roots_Segment')">2. 森蕈 (Roots)</button><button class="tab-btn" onclick="showTab('Snow_Segment')">3. 雪山 (Snow)</button><button class="tab-btn" onclick="showTab('Desert_Segment')">3. 沙漠 (Desert)</button><button class="tab-btn" onclick="showTab('Caldera_Segment')">4. 破火山口 (Caldera)</button><button class="tab-btn" onclick="showTab('Volcano_Segment')">5. 火山口 (Volcano)</button></div>
<div class="no-results" id="noResults">😕 当前关卡没有匹配结果，试试切换到其他关卡标签</div>
<div class="cmp-indicator" id="cmpIndicator" onclick="showComparePanel()" title="点击查看对比">⊕ 对比 (0/2)</div>

<div class="content" id="contentArea"><div class="tab-content" id="tab-Beach_Segment"></div><div class="tab-content" id="tab-Jungle_Segment"></div><div class="tab-content" id="tab-Roots_Segment"></div><div class="tab-content" id="tab-Snow_Segment"></div><div class="tab-content" id="tab-Desert_Segment"></div><div class="tab-content" id="tab-Caldera_Segment"></div><div class="tab-content" id="tab-Volcano_Segment"></div></div><button class="back-to-top" id="backToTop" onclick="scrollToTop()" title="回到顶部">⬆</button>

<!-- 对比面板 -->
<div class="compare-panel" id="comparePanel">
<div class="compare-header">
<h3>📊 生成器参数对比</h3>
<div><button onclick="clearCompare()">清空对比</button> <button onclick="closeComparePanel()">✕ 关闭</button></div>
</div>
<div class="compare-body" id="compareBody"></div>
</div>

<!-- 参数设置弹窗 -->
<div class="settings-overlay" id="settingsOverlay">
<div class="settings-modal">
<h3>⚙ 自定义参数显示</h3>
<p style="color:#888;font-size:0.85em;margin-bottom:10px;">勾选要显示的参数，未勾选的将被隐藏（精简模式）</p>
<div class="presets">
<button onclick="settingsPreset('core')" class="active">核心参数</button>
<button onclick="settingsPreset('all')">全部显示</button>
<button onclick="settingsPreset('none')">全部隐藏</button>
</div>
<div class="param-grid" id="paramGrid">
<label class="param-cb"><input type="checkbox" value="Deadzone"> 死区 (Deadzone)</label>
<label class="param-cb"><input type="checkbox" value="DesiredResult"> 期望值 (DesiredResult)</label>
<label class="param-cb"><input type="checkbox" value="LayerType"> LayerType</label>
<label class="param-cb"><input type="checkbox" value="RaycastDistance"> RaycastDistance</label>
<label class="param-cb"><input type="checkbox" value="addRotation"> 加旋转 (addRotation)</label>
<label class="param-cb"><input type="checkbox" value="area" checked> 范围 (area)</label>
<label class="param-cb"><input type="checkbox" value="axisMultipliers"> 轴倍率 (axisMultipliers)</label>
<label class="param-cb"><input type="checkbox" value="blend"> 混合 (blend)</label>
<label class="param-cb"><input type="checkbox" value="chanceToUseSpawner" checked> 使用概率 (chanceToUseSpawner)</label>
<label class="param-cb"><input type="checkbox" value="childName"> 子对象名 (childName)</label>
<label class="param-cb"><input type="checkbox" value="effectedLayers"> 影响层 (effectedLayers)</label>
<label class="param-cb"><input type="checkbox" value="eulerAngles"> 欧拉角 (eulerAngles)</label>
<label class="param-cb"><input type="checkbox" value="eulerAnglesRandom"> 随机角 (eulerAnglesRandom)</label>
<label class="param-cb"><input type="checkbox" value="findAllSpawners"> 全生成器 (findAllSpawners)</label>
<label class="param-cb"><input type="checkbox" value="flipNormal"> 翻转法线 (flipNormal)</label>
<label class="param-cb"><input type="checkbox" value="height"> 高度 (height)</label>
<label class="param-cb"><input type="checkbox" value="increment"> 步长 (increment)</label>
<label class="param-cb"><input type="checkbox" value="invert"> 反转 (invert)</label>
<label class="param-cb"><input type="checkbox" value="inverted"> 反转 (inverted)</label>
<label class="param-cb"><input type="checkbox" value="layerType" checked> 层类型 (layerType)</label>
<label class="param-cb"><input type="checkbox" value="localEnd"> 终点 (localEnd)</label>
<label class="param-cb"><input type="checkbox" value="localStart"> 起点 (localStart)</label>
<label class="param-cb"><input type="checkbox" value="maxAngle"> 最大角 (maxAngle)</label>
<label class="param-cb"><input type="checkbox" value="maxEffect"> 最大效果 (maxEffect)</label>
<label class="param-cb"><input type="checkbox" value="maxHeight"> 最高 (maxHeight)</label>
<label class="param-cb"><input type="checkbox" value="maxOffset"> 最大偏移 (maxOffset)</label>
<label class="param-cb"><input type="checkbox" value="maxRotation"> 最大旋转 (maxRotation)</label>
<label class="param-cb"><input type="checkbox" value="maxScaleMult"> 最大缩放 (maxScaleMult)</label>
<label class="param-cb"><input type="checkbox" value="maxUpLerp"> 最大上插 (maxUpLerp)</label>
<label class="param-cb"><input type="checkbox" value="minAngle"> 最小角 (minAngle)</label>
<label class="param-cb"><input type="checkbox" value="minDistance"> 最小距离 (minDistance)</label>
<label class="param-cb"><input type="checkbox" value="minEffect"> 最小效果 (minEffect)</label>
<label class="param-cb"><input type="checkbox" value="minHeight"> 最低 (minHeight)</label>
<label class="param-cb"><input type="checkbox" value="minMax"> 数值范围 (minMax)</label>
<label class="param-cb"><input type="checkbox" value="minMaxSpawn"> 最小最大生成 (minMaxSpawn)</label>
<label class="param-cb"><input type="checkbox" value="minOffset"> 最小偏移 (minOffset)</label>
<label class="param-cb"><input type="checkbox" value="minRotation"> 最小旋转 (minRotation)</label>
<label class="param-cb"><input type="checkbox" value="minScaleMult"> 最小缩放 (minScaleMult)</label>
<label class="param-cb"><input type="checkbox" value="minSpawnCount"> 最少数量 (minSpawnCount)</label>
<label class="param-cb"><input type="checkbox" value="minUpLerp"> 最小上插 (minUpLerp)</label>
<label class="param-cb"><input type="checkbox" value="mute"> 静音 (mute)</label>
<label class="param-cb"><input type="checkbox" value="nrOfSpawns" checked> 生成数量 (nrOfSpawns)</label>
<label class="param-cb"><input type="checkbox" value="offset"> 偏移 (offset)</label>
<label class="param-cb"><input type="checkbox" value="outVal"> 输出值 (outVal)</label>
<label class="param-cb"><input type="checkbox" value="overallSpawnChance"> 总生成概率 (overallSpawnChance)</label>
<label class="param-cb"><input type="checkbox" value="perlinOffset"> 噪声偏移 (perlinOffset)</label>
<label class="param-cb"><input type="checkbox" value="perlinSize"> 噪声尺寸 (perlinSize)</label>
<label class="param-cb"><input type="checkbox" value="radius"> 半径 (radius)</label>
<label class="param-cb"><input type="checkbox" value="random"> random</label>
<label class="param-cb"><input type="checkbox" value="randomPow"> 随机强度 (randomPow)</label>
<label class="param-cb"><input type="checkbox" value="randomSpawns"> 随机生成 (randomSpawns)</label>
<label class="param-cb"><input type="checkbox" value="rayCastSpawn"> 射线生成 (rayCastSpawn)</label>
<label class="param-cb"><input type="checkbox" value="rayDirectionOffset"> 射线偏移 (rayDirectionOffset)</label>
<label class="param-cb"><input type="checkbox" value="rayLength"> 射线长度 (rayLength)</label>
<label class="param-cb"><input type="checkbox" value="rayNearCutoff"> 近端裁剪 (rayNearCutoff)</label>
<label class="param-cb"><input type="checkbox" value="raycastPosition"> 射线定位 (raycastPosition)</label>
<label class="param-cb"><input type="checkbox" value="returnVal"> 返回值 (returnVal)</label>
<label class="param-cb"><input type="checkbox" value="scaleMinMax"> 最小最大缩放 (scaleMinMax)</label>
<label class="param-cb"><input type="checkbox" value="snapToIncrement"> 吸附步 (snapToIncrement)</label>
<label class="param-cb"><input type="checkbox" value="syncTransforms"> 同步变换 (syncTransforms)</label>

</div>
<div class="btn-row">
<button onclick="closeSettings()">取消</button>
<button class="primary" onclick="applySettings()">应用</button>
</div>
</div>
</div>

<div class="footer">
<p>数据来源：PEAK 1.62.a DreamyAscent Snapshot V2（27份诊断样本） | 翻译参考：TerrainCustomiserCN DisplayNameTranslator</p>
</div>

<script src="script.js"></script>

</body>
</html>
