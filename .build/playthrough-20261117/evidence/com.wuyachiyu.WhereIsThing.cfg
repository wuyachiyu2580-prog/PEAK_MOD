## Settings file was created by plugin WhereIsThing v0.1.3
## Plugin GUID: com.wuyachiyu.WhereIsThing

[Display]

## 物品名称跟随游戏语言，或强制使用英文/简体中文。
# Setting type: ThingNameLanguage
# Default value: Game
# Acceptable values: Game, English, SimplifiedChinese
NameLanguage = Game

## 所选地图范围内的最大距离，单位米。0 表示不限距离，仍遵守地图范围。
# Setting type: Single
# Default value: 500
MaxDistance = 0

## 默认只显示当前关卡及入口营地，可切换到整张地图。自定义地图缺少有效关卡边界时，按场景归属和附近 40 米回退。
# Setting type: ThingMapScope
# Default value: CurrentSegment
# Acceptable values: CurrentSegment, WholeMap
MapScope = CurrentSegment

## 位置与距离标签的字号。
# Setting type: Single
# Default value: 22
FontSize = 30

## 选择位置标签字体；显示中文时会优先使用已有的中文字体补足缺字。
# Setting type: ThingLabelFont
# Default value: GameDefault
# Acceptable values: Auto, GameDefault, TmpDefault, KoreanBinggrae, Crazk
LabelFont = GameDefault

## 目标在屏幕外时显示方向提示。
# Setting type: Boolean
# Default value: true
ShowOffscreenDirection = true

## Show the placer name after supported labels.
# Setting type: Boolean
# Default value: true
ShowOwnerNames = true

BoldLabels = false

[General]

## 启用或关闭 WhereIsThing。
# Setting type: Boolean
# Default value: true
Enabled = true

