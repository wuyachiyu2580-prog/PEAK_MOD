## Settings file was created by plugin WhySoLaggy v1.0.5
## Plugin GUID: com.wuyachiyu.WhySoLaggy

[AbuseDetection]

## 启用网络滥用和炸房检测。
# Setting type: Boolean
# Default value: true
EnableAbuseDetection = true

## 每次网络滥用速率检查之间的间隔秒数。
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.5 to 5
CheckIntervalSeconds = 1

## 网络滥用汇总报告之间的间隔秒数。
# Setting type: Single
# Default value: 30
# Acceptable value range: From 10 to 120
ReportIntervalSeconds = 30

## 触发告警前允许的每秒最大 Instantiate 调用数。
# Setting type: Int32
# Default value: 15
# Acceptable value range: From 5 to 100
InstantiateRateThreshold = 15

## 触发告警前允许的每秒最大 Destroy 调用数。
# Setting type: Int32
# Default value: 20
# Acceptable value range: From 5 to 100
DestroyRateThreshold = 20

## 触发告警前允许的每秒最大 RPC 调用数。
# Setting type: Int32
# Default value: 50
# Acceptable value range: From 10 to 200
RpcRateThreshold = 50

## 每个检测周期内触发对象增长告警所需的数量增幅。
# Setting type: Int32
# Default value: 30
# Acceptable value range: From 5 to 100
ObjectSpikeThreshold = 30

## 单个远端 Actor 对同一 RPC 方法在一个检测窗口内触发告警前允许的最大调用数。
# Setting type: Int32
# Default value: 20
# Acceptable value range: From 5 to 500
ActorMethodRateThreshold = 20

## 单个新所有者在一个检测窗口内触发告警前允许的最大远端所有权转移数。
# Setting type: Int32
# Default value: 10
# Acceptable value range: From 2 to 200
OwnershipGrabRateThreshold = 10

## 单个远端 Actor 在一个检测窗口内触发告警前允许的最大所有权请求数。
# Setting type: Int32
# Default value: 20
# Acceptable value range: From 2 to 500
OwnershipRequestRateThreshold = 20

## 同一个滥用告警键再次输出前需要等待的秒数。
# Setting type: Single
# Default value: 10
# Acceptable value range: From 1 to 60
AlertCooldownSeconds = 10

[Capture]

## 严重或连续卡顿后自动采集插件耗时，再深入有证据的补丁目标。
# Setting type: Boolean
# Default value: true
AutoCapture = true

## 开始或停止一次 30 秒手动录制。
# Setting type: KeyboardShortcut
# Default value: F9 + LeftControl
CaptureKey = F9 + LeftControl

## 在记录中加入带时间的标记。
# Setting type: KeyboardShortcut
# Default value: F10 + LeftControl
MarkerKey = F10 + LeftControl

[FieldProbe]

## 启用字段探针：通过 JSON 规则文件反射读取任意方法的字段、参数和返回值。关闭时无开销。
# Setting type: Boolean
# Default value: false
EnableFieldProbe = false

## FieldProbe JSON 规则文件路径。相对路径以 BepInEx/config/ 为基准。规则格式请参阅示例文件。
# Setting type: String
# Default value: WhySoLaggy.fieldprobe.json
RulesFile = WhySoLaggy.fieldprobe.json

## 规则未指定 rateLimit 时，每条规则每秒允许的默认最大快照数。
# Setting type: Int32
# Default value: 60
# Acceptable value range: From 1 to 10000
DefaultRateLimit = 60

## 每个快照值的默认最大字符串长度。更长的值会截断为 '...'。
# Setting type: Int32
# Default value: 128
# Acceptable value range: From 16 to 4096
DefaultMaxValueLen = 128

## 规则未指定 includeStack 时，是否默认附加过滤后的调用堆栈。
# Setting type: Boolean
# Default value: false
DefaultIncludeStack = false

## 启用 includeStack 时，每个快照默认捕获的最大堆栈帧数。
# Setting type: Int32
# Default value: 5
# Acceptable value range: From 1 to 30
DefaultStackMaxDepth = 5

[General]

## 卡顿检测的帧时间阈值，单位毫秒。超过阈值的帧会被记录。
# Setting type: Int32
# Default value: 50
# Acceptable value range: From 16 to 200
SpikeThresholdMs = 50

## 性能周期报告之间的间隔秒数。
# Setting type: Int32
# Default value: 10
# Acceptable value range: From 5 to 60
ReportIntervalSeconds = 10

## 分析每个 BepInEx 插件的 Update、LateUpdate 和 FixedUpdate 回调。默认关闭，仅在诊断问题时启用。
# Setting type: Boolean
# Default value: false
EnablePluginProfiling = true

## 分析支持的 Harmony 补丁方法。启动初始化完成后，开关在下一帧生效；关闭时只撤销耗时采集，不关闭其他诊断或语言功能。默认关闭。
# Setting type: Boolean
# Default value: false
EnablePatchProfiling = true

## 报告中显示的高耗时方法数量。
# Setting type: Int32
# Default value: 10
# Acceptable value range: From 3 to 30
TopMethodCount = 10

## 仅用于自适应采样模式的平均耗时阈值；明确报告采样覆盖率。
# Setting type: Single
# Default value: 0.1
# Acceptable value range: From 0 to 5
MinReportMs = 0.1

## PluginProfiler 要跳过的插件 GUID，使用逗号分隔。
# Setting type: String
# Default value: 
IgnorePluginGuids = 

## 要跳过的方法名（Type.Method 或完整签名），以逗号分隔。在下一次安全的补丁切换时生效。
# Setting type: String
# Default value: 
IgnorePatchMethods = 

## 监测 Unity/托管内存、有符号净变化和受支持的 GC 指标；不可用指标不补零。
# Setting type: Boolean
# Default value: true
EnableMemoryMonitor = true

## 手动补丁计时可在入口采样；自动详细录制保持精确。
# Setting type: Boolean
# Default value: false
AdaptiveTiming = true

## 读取受支持的 CPU/GPU 指标；不可用时明确显示不可用。
# Setting type: Boolean
# Default value: false
CpuGpuMetrics = true

[Logging]

## Minimal（默认）= 滥用告警、详情、监控初始化/错误/关键节点；Normal = Minimal 加周期报告（RPC、FPS、补丁/插件分析和帧尖峰详情）。
# Setting type: LogVerbosity
# Default value: Minimal
# Acceptable values: Minimal, Normal
LogVerbosity = Normal

## 结构化 CSV/JSONL 文件超过此大小时进行轮转，单位 MB。
# Setting type: Int32
# Default value: 10
# Acceptable value range: From 1 to 100
MaxLogFileSizeMB = 10

## 每种格式最多保留的 CSV 或 JSONL 轮转文件数量。
# Setting type: Int32
# Default value: 30
# Acceptable value range: From 1 to 200
MaxRotatedFiles = 30

## 每种格式最多保留的 CSV 或 JSONL 轮转文件总大小，单位 MB。
# Setting type: Int32
# Default value: 350
# Acceptable value range: From 1 to 4096
MaxRotatedStorageMB = 350

[MethodTracer]

## 要捕获 Environment.StackTrace 的完整方法名，使用逗号分隔（开销较高，仅在诊断时启用，例如 'Player.Update,ColdComponent.Apply'）。留空则关闭追踪。
# Setting type: String
# Default value: 
TraceMethodNames = 

## 每条追踪样本记录的最大堆栈帧数。
# Setting type: Int32
# Default value: 5
# Acceptable value range: From 3 to 20
TraceMaxDepth = 5

## 每个方法每秒最多记录的追踪样本数。超出的样本会被丢弃。
# Setting type: Int32
# Default value: 100
# Acceptable value range: From 10 to 1000
TraceRateLimit = 100

[RpcMonitor]

## 记录所有网络 RPC 方法名及其来源。总量统计独立于采样的详细记录。
# Setting type: Boolean
# Default value: true
EnableRpcMonitor = true

## 周期报告中显示的高频 RPC 方法数量。
# Setting type: Int32
# Default value: 10
# Acceptable value range: From 3 to 30
TopMethodCount = 10

## 高风险监控 RPC 的单方法环形缓冲区请求容量；所有方法合计最多保留 1024 条。每个方法拥有独立缓冲区，避免高频方法挤掉低频方法的记录。
# Setting type: Int32
# Default value: 32
# Acceptable value range: From 8 to 256
WatchedRecordPerMethodCapacity = 32

## 每次周期报告中每个监控方法显示的最新详细记录数量。
# Setting type: Int32
# Default value: 6
# Acceptable value range: From 1 to 50
WatchedShowPerMethod = 6

## 要加入监控列表的额外 RPC 方法名，使用逗号分隔（例如 'MyRPC1,MyRPC2'）。
# Setting type: String
# Default value: 
ExtraWatchMethods = 

## 主线程每帧最多处理的 RPC 队列项目数。
# Setting type: Int32
# Default value: 32
# Acceptable value range: From 8 to 256
PumpBatchSize = 32

## RPC 记录队列的最大容量。队列满时丢弃最旧记录，以保留最新活动。
# Setting type: Int32
# Default value: 2048
# Acceptable value range: From 256 to 65536
QueueCapacity = 2048

## RPC 明细处理的每帧软预算，单位毫秒；单条处理无法中断。
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0.1 to 5
PumpBudgetMs = 0.5

[UI]

## 显示可拖动的屏幕性能面板。关闭时无开销。
# Setting type: Boolean
# Default value: false
ShowDashboard = false

## 诊断面板字体大小。
# Setting type: Single
# Default value: 14
# Acceptable value range: From 11 to 24
FontSize = 14

## 保存的诊断面板坐标，限制在屏幕内。
# Setting type: String
# Default value: 16,16
Position = 16,16

## 在文字输入和按键绑定之外切换诊断面板。
# Setting type: KeyboardShortcut
# Default value: F8 + LeftControl
DashboardKey = F8 + LeftControl

