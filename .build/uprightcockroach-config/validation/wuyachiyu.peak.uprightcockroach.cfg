[Antenna.Left]

## Exact Scout bone name / 挂点骨骼名。Unknown names fall back to Head.
# Setting type: String
# Default value: Head
AttachmentBone = Head

## Root offset in attachment-bone local units / 相对挂点骨骼的局部坐标偏移。 X
# Setting type: Single
# Default value: 0
# Acceptable value range: From -5 to 5
PositionX = 0

## Root offset in attachment-bone local units / 相对挂点骨骼的局部坐标偏移。 Y
# Setting type: Single
# Default value: 0
# Acceptable value range: From -5 to 5
PositionY = 0

## Root offset in attachment-bone local units / 相对挂点骨骼的局部坐标偏移。 Z
# Setting type: Single
# Default value: 0
# Acceptable value range: From -5 to 5
PositionZ = 0

## Root Euler rotation in degrees / 触须根部局部旋转，单位度。 X
# Setting type: Single
# Default value: 0
# Acceptable value range: From -360 to 360
RotationX = 0

## Root Euler rotation in degrees / 触须根部局部旋转，单位度。 Y
# Setting type: Single
# Default value: 0
# Acceptable value range: From -360 to 360
RotationY = 0

## Root Euler rotation in degrees / 触须根部局部旋转，单位度。 Z
# Setting type: Single
# Default value: 0
# Acceptable value range: From -360 to 360
RotationZ = 0

## Additional root offset for the local player's first-person view / 本地第一人称额外偏移。 X
# Setting type: Single
# Default value: 0
# Acceptable value range: From -5 to 5
FirstPersonOffsetX = 0

## Additional root offset for the local player's first-person view / 本地第一人称额外偏移。 Y
# Setting type: Single
# Default value: 0
# Acceptable value range: From -5 to 5
FirstPersonOffsetY = 0

## Additional root offset for the local player's first-person view / 本地第一人称额外偏移。 Z
# Setting type: Single
# Default value: 0
# Acceptable value range: From -5 to 5
FirstPersonOffsetZ = 0

## Lower placeholder segment CENTER relative to antenna root / 下段中心相对触须根部的坐标。 X
# Setting type: Single
# Default value: -0.16
# Acceptable value range: From -5 to 5
LowerPositionX = -0.16

## Lower placeholder segment CENTER relative to antenna root / 下段中心相对触须根部的坐标。 Y
# Setting type: Single
# Default value: 0.2
# Acceptable value range: From -5 to 5
LowerPositionY = 0.2

## Lower placeholder segment CENTER relative to antenna root / 下段中心相对触须根部的坐标。 Z
# Setting type: Single
# Default value: 0.08
# Acceptable value range: From -5 to 5
LowerPositionZ = 0.08

## Lower placeholder segment Euler rotation in degrees / 下段局部旋转，单位度。 X
# Setting type: Single
# Default value: 0
# Acceptable value range: From -360 to 360
LowerRotationX = 0

## Lower placeholder segment Euler rotation in degrees / 下段局部旋转，单位度。 Y
# Setting type: Single
# Default value: -24
# Acceptable value range: From -360 to 360
LowerRotationY = -24

## Lower placeholder segment Euler rotation in degrees / 下段局部旋转，单位度。 Z
# Setting type: Single
# Default value: 18
# Acceptable value range: From -360 to 360
LowerRotationZ = 18

## Upper placeholder segment CENTER relative to antenna root / 上段中心相对触须根部的坐标。 X
# Setting type: Single
# Default value: -0.22
# Acceptable value range: From -5 to 5
UpperPositionX = -0.22

## Upper placeholder segment CENTER relative to antenna root / 上段中心相对触须根部的坐标。 Y
# Setting type: Single
# Default value: 0.43
# Acceptable value range: From -5 to 5
UpperPositionY = 0.43

## Upper placeholder segment CENTER relative to antenna root / 上段中心相对触须根部的坐标。 Z
# Setting type: Single
# Default value: 0.18
# Acceptable value range: From -5 to 5
UpperPositionZ = 0.18

## Upper placeholder segment Euler rotation in degrees / 上段局部旋转，单位度。 X
# Setting type: Single
# Default value: 0
# Acceptable value range: From -360 to 360
UpperRotationX = 0

## Upper placeholder segment Euler rotation in degrees / 上段局部旋转，单位度。 Y
# Setting type: Single
# Default value: -20
# Acceptable value range: From -360 to 360
UpperRotationY = -20

## Upper placeholder segment Euler rotation in degrees / 上段局部旋转，单位度。 Z
# Setting type: Single
# Default value: -14
# Acceptable value range: From -360 to 360
UpperRotationZ = -14

## Placeholder segment length multiplier; centers stay editable independently / 占位触须段长度倍率，不移动各段中心。
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.05 to 5
LengthScale = 1

## Placeholder segment diameter multiplier / 占位触须粗细倍率。
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.05 to 5
ThicknessScale = 1

