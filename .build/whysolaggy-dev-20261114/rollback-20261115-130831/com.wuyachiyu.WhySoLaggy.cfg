## Settings file was created by plugin WhySoLaggy v1.0.5
## Plugin GUID: com.wuyachiyu.WhySoLaggy

[AbuseDetection]

## Enable network abuse / room bombing detection.
# Setting type: Boolean
# Default value: true
EnableAbuseDetection = true

## Seconds between each abuse rate check.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.5 to 5
CheckIntervalSeconds = 1

## Seconds between periodic abuse summary reports.
# Setting type: Single
# Default value: 30
# Acceptable value range: From 10 to 120
ReportIntervalSeconds = 10

## Max Instantiate calls per second before triggering alert.
# Setting type: Int32
# Default value: 15
# Acceptable value range: From 5 to 100
InstantiateRateThreshold = 15

## Max Destroy calls per second before triggering alert.
# Setting type: Int32
# Default value: 20
# Acceptable value range: From 5 to 100
DestroyRateThreshold = 20

## Max RPC calls per second before triggering alert.
# Setting type: Int32
# Default value: 50
# Acceptable value range: From 10 to 200
RpcRateThreshold = 50

## Object count increase per check interval to trigger spike alert.
# Setting type: Int32
# Default value: 30
# Acceptable value range: From 5 to 100
ObjectSpikeThreshold = 30

## Max calls for one remote Actor and RPC method per check window before alerting.
# Setting type: Int32
# Default value: 20
# Acceptable value range: From 5 to 500
ActorMethodRateThreshold = 20

## Max remote ownership transfers to one new owner per check window before alerting.
# Setting type: Int32
# Default value: 10
# Acceptable value range: From 2 to 200
OwnershipGrabRateThreshold = 10

## Max ownership requests from one remote actor per check window before alerting.
# Setting type: Int32
# Default value: 20
# Acceptable value range: From 2 to 500
OwnershipRequestRateThreshold = 20

## Seconds before the same abuse alert key can be emitted again.
# Setting type: Single
# Default value: 10
# Acceptable value range: From 1 to 60
AlertCooldownSeconds = 10

[FieldProbe]

## Enable FieldProbe: reflectively snapshot arbitrary fields / parameters / return values at any method via a JSON rules file. Zero overhead when disabled.
# Setting type: Boolean
# Default value: false
EnableFieldProbe = false

## Path to FieldProbe JSON rules file. Relative path resolves under BepInEx/config/. See sample file for schema.
# Setting type: String
# Default value: WhySoLaggy.fieldprobe.json
RulesFile = WhySoLaggy.fieldprobe.json

## Default max snapshots per rule per second when a rule doesn't specify its own rateLimit.
# Setting type: Int32
# Default value: 60
# Acceptable value range: From 1 to 10000
DefaultRateLimit = 60

## Default max string length per snapshot value. Longer values are truncated with '...'.
# Setting type: Int32
# Default value: 128
# Acceptable value range: From 16 to 4096
DefaultMaxValueLen = 128

## Default: whether to attach filtered call stack when a rule doesn't specify includeStack.
# Setting type: Boolean
# Default value: false
DefaultIncludeStack = false

## Default max stack frames captured per snapshot when includeStack is enabled.
# Setting type: Int32
# Default value: 5
# Acceptable value range: From 1 to 30
DefaultStackMaxDepth = 5

[General]

## Frame time threshold for spike detection (ms). Frames exceeding this are logged.
# Setting type: Int32
# Default value: 50
# Acceptable value range: From 16 to 200
SpikeThresholdMs = 50

## Seconds between periodic performance reports.
# Setting type: Int32
# Default value: 10
# Acceptable value range: From 5 to 60
ReportIntervalSeconds = 10

## Profile each BepInEx plugin's Update/LateUpdate/FixedUpdate callbacks. Disabled by default; turn on only when diagnosing.
# Setting type: Boolean
# Default value: false
EnablePluginProfiling = true

## Profile supported Harmony-patched methods. Toggle applies on the next game update after startup initialization; disabling removes only timing hooks. Disabled by default.
# Setting type: Boolean
# Default value: false
EnablePatchProfiling = true

## Number of top slow methods to show in reports.
# Setting type: Int32
# Default value: 10
# Acceptable value range: From 3 to 30
TopMethodCount = 10

## Sample low-cost methods less often below this average time (ms); calls and frame timings remain counted. Applied when patch profiling is next enabled.
# Setting type: Single
# Default value: 0.1
# Acceptable value range: From 0 to 5
MinReportMs = 0.1

## Comma-separated plugin GUIDs to skip in PluginProfiler.
# Setting type: String
# Default value: 
IgnorePluginGuids = 

## Comma-separated method names (Type.Method or full signatures) to skip. Applied when patch profiling is next enabled or the game restarts.
# Setting type: String
# Default value: 
IgnorePatchMethods = 

## Sample GC allocation rate and include AllocRateKBps in FpsReport events.
# Setting type: Boolean
# Default value: true
EnableMemoryMonitor = true

[Logging]

## Minimal (default) = abuse alerts + their detail lines + monitor init/error/milestones. Normal = Minimal + periodic reports (RPC top/watched, FPS, patch/plugin profiler, frame spike detail).
# Setting type: LogVerbosity
# Default value: Minimal
# Acceptable values: Minimal, Normal
LogVerbosity = Normal

## Rotate structured CSV/JSONL files when they exceed this size.
# Setting type: Int32
# Default value: 10
# Acceptable value range: From 1 to 100
MaxLogFileSizeMB = 10

## Maximum number of rotated CSV or JSONL files retained per format.
# Setting type: Int32
# Default value: 30
# Acceptable value range: From 1 to 200
MaxRotatedFiles = 30

## Maximum total size of rotated CSV or JSONL files retained per format.
# Setting type: Int32
# Default value: 350
# Acceptable value range: From 1 to 4096
MaxRotatedStorageMB = 350

[MethodTracer]

## Comma-separated method full names to attach a stack-tracing prefix (e.g. 'Player.Update,ColdComponent.Apply'). Empty disables tracing.
# Setting type: String
# Default value: 
TraceMethodNames = 

## Maximum stack frames recorded per trace sample.
# Setting type: Int32
# Default value: 5
# Acceptable value range: From 3 to 20
TraceMaxDepth = 5

## Max trace records per method per second. Excess samples are dropped.
# Setting type: Int32
# Default value: 100
# Acceptable value range: From 10 to 1000
TraceRateLimit = 100

[RpcMonitor]

## Track all network RPC method names and their sources. Low performance overhead (<0.5ms/s for 1000 RPCs/s).
# Setting type: Boolean
# Default value: true
EnableRpcMonitor = true

## Number of top RPC methods to show in periodic reports.
# Setting type: Int32
# Default value: 10
# Acceptable value range: From 3 to 30
TopMethodCount = 10

## Per-method ring buffer size for watched high-risk RPCs. Each watched method has its own independent buffer so high-frequency methods (e.g. SyncAfflictionsRPC) cannot flood out low-frequency ones (e.g. SendFeedDataRPC).
# Setting type: Int32
# Default value: 32
# Acceptable value range: From 8 to 256
WatchedRecordPerMethodCapacity = 32

## How many most-recent detailed records to print per watched method in each periodic report.
# Setting type: Int32
# Default value: 6
# Acceptable value range: From 1 to 50
WatchedShowPerMethod = 6

## Comma-separated extra RPC method names merged into the watch list (e.g. 'MyRPC1,MyRPC2').
# Setting type: String
# Default value: 
ExtraWatchMethods = 

## Max RPC queue items consumed per frame on main thread.
# Setting type: Int32
# Default value: 32
# Acceptable value range: From 8 to 256
PumpBatchSize = 32

## Maximum queued RPC records. When full, the oldest records are discarded so recent activity is retained.
# Setting type: Int32
# Default value: 2048
# Acceptable value range: From 256 to 65536
QueueCapacity = 2048

[UI]

## Show draggable on-screen performance dashboard. Zero cost when disabled.
# Setting type: Boolean
# Default value: false
ShowDashboard = false

