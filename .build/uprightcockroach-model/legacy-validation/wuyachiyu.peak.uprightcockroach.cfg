[Antenna.Left]

## Exact Scout bone name / 挂点骨骼名。Unknown names fall back to Head.
# Setting type: String
# Default value: Head
AttachmentBone = Head

## Root offset in attachment-bone local units / 相对挂点骨骼的局部坐标偏移。 X
# Setting type: Single
# Default value: 0
# Acceptable value range: From -5 to 5
PositionX = 0

## Root offset in attachment-bone local units / 相对挂点骨骼的局部坐标偏移。 Y
# Setting type: Single
# Default value: 0
# Acceptable value range: From -5 to 5
PositionY = 0

## Root offset in attachment-bone local units / 相对挂点骨骼的局部坐标偏移。 Z
# Setting type: Single
# Default value: 0
# Acceptable value range: From -5 to 5
PositionZ = 0

## Root Euler rotation in degrees / 触须根部局部旋转，单位度。 X
# Setting type: Single
# Default value: 0
# Acceptable value range: From -360 to 360
RotationX = 0

## Root Euler rotation in degrees / 触须根部局部旋转，单位度。 Y
# Setting type: Single
# Default value: 0
# Acceptable value range: From -360 to 360
RotationY = 0

## Root Euler rotation in degrees / 触须根部局部旋转，单位度。 Z
# Setting type: Single
# Default value: 0
# Acceptable value range: From -360 to 360
RotationZ = 0

## Additional root offset for the local player's first-person view / 本地第一人称额外偏移。 X
# Setting type: Single
# Default value: 0
# Acceptable value range: From -5 to 5
FirstPersonOffsetX = 0

## Additional root offset for the local player's first-person view / 本地第一人称额外偏移。 Y
# Setting type: Single
# Default value: 0
# Acceptable value range: From -5 to 5
FirstPersonOffsetY = 0

## Additional root offset for the local player's first-person view / 本地第一人称额外偏移。 Z
# Setting type: Single
# Default value: 0
# Acceptable value range: From -5 to 5
FirstPersonOffsetZ = 0

## Lower bone position offset from imported bind pose / 下段骨相对导入默认姿态的位置偏移。 X
# Setting type: Single
# Default value: -0.16
# Acceptable value range: From -5 to 5
LowerPositionX = -0.16

## Lower bone position offset from imported bind pose / 下段骨相对导入默认姿态的位置偏移。 Y
# Setting type: Single
# Default value: 0.2
# Acceptable value range: From -5 to 5
LowerPositionY = 0.2

## Lower bone position offset from imported bind pose / 下段骨相对导入默认姿态的位置偏移。 Z
# Setting type: Single
# Default value: 0.08
# Acceptable value range: From -5 to 5
LowerPositionZ = 0.08

## Lower bone rotation offset in degrees / 下段骨局部旋转偏移，单位度。 X
# Setting type: Single
# Default value: 0
# Acceptable value range: From -360 to 360
LowerRotationX = 0

## Lower bone rotation offset in degrees / 下段骨局部旋转偏移，单位度。 Y
# Setting type: Single
# Default value: -24
# Acceptable value range: From -360 to 360
LowerRotationY = -24

## Lower bone rotation offset in degrees / 下段骨局部旋转偏移，单位度。 Z
# Setting type: Single
# Default value: 18
# Acceptable value range: From -360 to 360
LowerRotationZ = 18

## Upper bone position offset relative to lower bone / 上段骨相对下段骨的局部位置偏移。 X
# Setting type: Single
# Default value: -0.22
# Acceptable value range: From -5 to 5
UpperPositionX = -0.22

## Upper bone position offset relative to lower bone / 上段骨相对下段骨的局部位置偏移。 Y
# Setting type: Single
# Default value: 0.43
# Acceptable value range: From -5 to 5
UpperPositionY = 0.43

## Upper bone position offset relative to lower bone / 上段骨相对下段骨的局部位置偏移。 Z
# Setting type: Single
# Default value: 0.18
# Acceptable value range: From -5 to 5
UpperPositionZ = 0.18

## Upper bone rotation offset in degrees / 上段骨局部旋转偏移，单位度。 X
# Setting type: Single
# Default value: 0
# Acceptable value range: From -360 to 360
UpperRotationX = 0

## Upper bone rotation offset in degrees / 上段骨局部旋转偏移，单位度。 Y
# Setting type: Single
# Default value: -20
# Acceptable value range: From -360 to 360
UpperRotationY = -20

## Upper bone rotation offset in degrees / 上段骨局部旋转偏移，单位度。 Z
# Setting type: Single
# Default value: -14
# Acceptable value range: From -360 to 360
UpperRotationZ = -14

## Antenna chain length multiplier / 触须骨链长度倍率。
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.05 to 5
LengthScale = 1

## Antenna thickness multiplier / 触须粗细倍率。
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.05 to 5
ThicknessScale = 1

